name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchs_co_fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: watchs_co_fe/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchs_co_be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: watchs_co_be/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --runInBand

  integration:
    name: Backend integration tests
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchs_co_be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: watchs_co_be/package-lock.json
      - run: npm ci
      - run: npm run test:integration -- --runInBand
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DB_SSL: "true"
